<title>Para la Rena</title>

<style>
  /* Layout: una sola pantalla de atardecer, foto arriba y la pregunta centrada en columna */
  :root{
    --sky-top:#2a1a3e;
    --sky-mid:#7b3f6b;
    --sky-low:#d98a6a;
    --sky-glow:#f4c99a;
    --fg:#fff6ef;
    --fg-soft:#f6d9c6;
    --accent:#ffd27a;
    color-scheme: dark;
    --font:"Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html,body{height:100%}
  body{
    margin:0;min-height:100%;
    background:radial-gradient(120% 80% at 50% 118%, var(--sky-glow) 0%, var(--sky-low) 22%, var(--sky-mid) 52%, var(--sky-top) 100%);
    color:var(--fg);font-family:var(--font);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    overflow:hidden;position:relative;
    padding-left:max(20px, env(safe-area-inset-left, 0px));
    padding-right:max(20px, env(safe-area-inset-right, 0px));
    padding-block:40px;box-sizing:border-box;
  }
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  .star{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--fg);opacity:.0;animation:tw 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.1}50%{opacity:.9}}
  .moon{position:fixed;top:9%;right:14%;width:48px;height:48px;border-radius:50%;
    background:radial-gradient(circle at 38% 38%, #fff8ef, #ffe7c4 60%, rgba(255,210,122,.3));
    box-shadow:0 0 50px 12px rgba(255,226,180,.35);z-index:0}
  .wrap{position:relative;z-index:2;width:100%;max-width:440px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:20px}
  .eyebrow{font-size:clamp(14px,4vw,17px);letter-spacing:3px;text-transform:uppercase;color:var(--accent);font-weight:600}
  .frame{width:clamp(150px,46vw,190px);aspect-ratio:1;max-width:100%;border-radius:50%;overflow:hidden;
    border:3px solid rgba(255,246,239,.85);
    box-shadow:0 14px 44px rgba(0,0,0,.4), 0 0 0 7px rgba(255,210,122,.18);}
  .frame img{width:100%;height:100%;object-fit:cover;display:block}
  .ask{font-size:clamp(30px,8.5vw,44px);font-weight:700;line-height:1.1;text-wrap:balance;margin:0;
    text-shadow:0 3px 24px rgba(0,0,0,.3)}
  .ask b{color:var(--accent)}
  .sub{font-size:clamp(15px,4.2vw,18px);color:var(--fg-soft);line-height:1.55;max-width:32ch;margin:0 auto;font-weight:400}
  .btn{margin-top:4px;font-family:var(--font);font-size:clamp(18px,5vw,22px);font-weight:600;color:#3a1026;
    background:linear-gradient(180deg,#ffe6a8,var(--accent));border:none;border-radius:999px;padding:14px 40px;cursor:pointer;
    box-shadow:0 10px 30px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.6);transition:transform .15s ease, box-shadow .15s ease}
  .btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 14px 36px rgba(0,0,0,.35)}
  .btn:active{transform:translateY(0) scale(.99)}
  .btn:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
  .yes{display:flex;flex-direction:column;align-items:center;gap:18px}
  .yes .big{font-size:clamp(54px,18vw,92px);font-weight:700;color:var(--accent);line-height:.95;
    text-shadow:0 4px 30px rgba(0,0,0,.3);animation:pop .6s cubic-bezier(.2,1.3,.4,1) both}
  @keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
  .yes .line{font-size:clamp(18px,5vw,23px);font-weight:500;color:var(--fg);line-height:1.45;text-wrap:balance}
  canvas#fx{position:fixed;inset:0;z-index:5;pointer-events:none}
  @media (prefers-reduced-motion: reduce){.star{animation:none}.yes .big{animation:none}}
</style>

  var canvas=document.getElementById('fx'),ctx=canvas.getContext('2d'),hearts=[],raf=null;
  function size(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
  size();addEventListener('resize',size);
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function heart(x,y,c,s,vy){return{x:x,y:y,c:c,s:s,vy:vy,vx:(Math.random()-.5)*1.2,rot:Math.random()*6,vr:(Math.random()-.5)*.1,a:1};}
  function drawHeart(h){ctx.save();ctx.translate(h.x,h.y);ctx.rotate(h.rot);ctx.scale(h.s,h.s);ctx.globalAlpha=Math.max(0,h.a);
    ctx.fillStyle=h.c;ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(0,-3,-5,-3,-5,1);ctx.bezierCurveTo(-5,4,0,6,0,9);
    ctx.bezierCurveTo(0,6,5,4,5,1);ctx.bezierCurveTo(5,-3,0,-3,0,0);ctx.fill();ctx.restore();}
  function tick(){ctx.clearRect(0,0,canvas.width,canvas.height);
    for(var i=hearts.length-1;i>=0;i--){var h=hearts[i];h.vy+=0.02;h.y+=h.vy;h.x+=h.vx;h.rot+=h.vr;
      if(h.y>innerHeight*0.55)h.a-=0.012;drawHeart(h);if(h.a<=0||h.y>innerHeight+40)hearts.splice(i,1);}
    if(hearts.length)raf=requestAnimationFrame(tick);else{raf=null;ctx.clearRect(0,0,canvas.width,canvas.height);}}
  function burst(){if(reduce)return;var colors=['#ff6b8a','#ffd27a','#ff9ab0','#fff6ef','#ff4f7b'];
    for(var i=0;i<90;i++){hearts.push(heart(Math.random()*innerWidth,-20-Math.random()*innerHeight*0.3,colors[i%colors.length],Math.random()*1.3+0.7,Math.random()*1.5+0.5));}
    if(!raf)raf=requestAnimationFrame(tick);}
  function sayYes(){document.getElementById('ask-view').hidden=true;document.getElementById('yes-view').hidden=false;
    burst();setTimeout(burst,900);try{localStorage.setItem('rena_yes','1');}catch(e){}}
  document.getElementById('yesBtn').addEventListener('click',sayYes);
  try{if(localStorage.getItem('rena_yes')==='1'){document.getElementById('ask-view').hidden=true;document.getElementById('yes-view').hidden=false;}}catch(e){}
</script>
</body>
</html>
